<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background -->
  <rect width="256" height="256" rx="40" fill="#0A0A12"/>

  <!-- Outer ring -->
  <circle cx="128" cy="128" r="96" fill="none" stroke="#7B6EE8" stroke-width="6" opacity="0.9"/>

  <!-- Middle ring -->
  <circle cx="128" cy="128" r="64" fill="none" stroke="#9B8EF8" stroke-width="4" opacity="0.7"/>

  <!-- Inner circle (the dot of ⊚) -->
  <circle cx="128" cy="128" r="28" fill="none" stroke="#BEB0FF" stroke-width="3.5" opacity="0.85"/>

  <!-- Center point -->
  <circle cx="128" cy="128" r="6" fill="#D4CCFF" opacity="0.95"/>

  <!-- Subtle radial glow -->
  <circle cx="128" cy="128" r="96" fill="none" stroke="#7B6EE8" stroke-width="1" opacity="0.25"/>
</svg>
